
  <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Mapa Interactivo - Cacomixtle en vivo</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; }
    #map { width: 100%; height: 100vh; }

    /* --- PANTALLA DE CARGA (LOADER) CON ANIMACIÓN DE AULLIDO --- */
    #loaderScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0d11; /* Fondo oscuro que combina con el marco del logo */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loaderScreen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Animación CSS que simula el aullido */
    @keyframes aullido {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
      }
      20% {
        /* Toma aire bajando un poco */
        transform: translateY(6px) rotate(-3deg) scale(0.97);
      }
      45% {
        /* Se estira e inclina hacia arriba para aullar */
        transform: translateY(-16px) rotate(-10deg) scale(1.08);
      }
      60% {
        /* Vibración/eco del aullido */
        transform: translateY(-13px) rotate(-8deg) scale(1.08);
      }
      75% {
        transform: translateY(-16px) rotate(-10deg) scale(1.08);
      }
      100% {
        /* Regresa a su posición de origen */
        transform: translateY(0) rotate(0deg) scale(1);
      }
    }

    .coyote-animado {
      width: 220px;
      height: 220px;
      object-fit: contain;
      animation: aullido 2.2s ease-in-out infinite;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
    }

    .texto-loader {
      color: #FFD54F;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      letter-spacing: 1px;
      text-align: center;
    }

    .subtexto-loader {
      color: #B0BEC5;
      font-size: 12px;
      margin-top: 6px;
    }

    /* Estilos para los marcadores */
    .leaflet-marker-icon.custom-icon {
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      object-fit: cover;
      background-color: #ffffff;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    /* Estilos para la ventana modal emergente */
    .modal-imagen {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-contenido {
      max-width: 90%;
      max-height: 30vh;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    .modal-info {
      color: white;
      text-align: center;
      margin-top: 15px;
      max-width: 90%;
    }

    .modal-info h3 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #FFD54F;
    }

    /* Burbuja de pregón */
    .burbuja-pregon {
      display: none;
      background: #E91E63;
      color: #ffffff;
      padding: 10px 15px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      line-height: 1.4;
    }

    .modal-info p {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 15px;
      color: #E0E0E0;
      text-align: justify;
    }

    .modal-info a {
      display: inline-block;
      color: #4FC3F7;
      font-weight: bold;
      text-decoration: underline;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .modal-cerrar {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #ffffff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .btn-ruta {
      padding: 12px 24px;
      background-color: #E91E63;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin-bottom: 10px;
      width: 100%;
      max-width: 280px;
    }

    .btn-quiz {
      padding: 12px 24px;
      background-color: #FF9800;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin-bottom: 15px;
      width: 100%;
      max-width: 280px;
    }

    /* Caja de Quiz Trivia */
    .contenedor-quiz {
      display: none;
      background: #263238;
      border: 2px solid #FFD54F;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
    }

    .contenedor-quiz h4 {
      color: #FFD54F;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .btn-opcion {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin: 6px 0;
      background: #37474F;
      color: white;
      border: 1px solid #78909C;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-opcion:hover {
      background: #455A64;
    }

    .resultado-quiz {
      margin-top: 10px;
      font-weight: bold;
      font-size: 14px;
    }

    /* Estilo del Popup del Cacomixtle */
    .cacomixtle-popup {
      text-align: center;
      font-family: sans-serif;
      padding: 5px;
    }
    .cacomixtle-popup h4 {
      margin: 0 0 5px 0;
      color: #E91E63;
      font-size: 14px;
    }
    .cacomixtle-popup p {
      margin: 0;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE CARGA -->
  <div id="loaderScreen">
    <img id="imgCoyoteLoader" class="coyote-animado" src="https://i.ibb.co/391YFXSh/coyote-logo.png" alt="Promotores Culturales Coyoacán" />
    <div class="texto-loader">Cargando Ruta Cultural...</div>
    <div class="subtexto-loader">Pedregal de Santo Domingo</div>
  </div>

  <div id="map"></div>

  <!-- Ventana Modal emergente -->
  <div id="modalImagen" class="modal-imagen">
    <span class="modal-cerrar" id="btnCerrar">&times;</span>
    <img id="imgGrande" class="modal-contenido" src="" alt="Punto de Interés" />
    
    <div class="modal-info">
      <h3 id="modalTitulo">Mercado Santo Domingo "LAS ROSAS"</h3>
      <div id="burbujaPregon" class="burbuja-pregon"></div>
      <p id="textoDescripcion">Surgió a la par del vertiginoso crecimiento del Pedregal de Santo Domingo...</p>
      <a id="linkVideo" href="" target="_blank">📺 Ver video del lugar</a>

      <!-- Sección de Quiz -->
      <div id="contenedorQuiz" class="contenedor-quiz">
        <h4 id="preguntaQuiz">🏆 Pregunta de Trivia</h4>
        <div id="opcionesQuiz"></div>
        <div id="resultadoQuiz" class="resultado-quiz"></div>
      </div>
    </div>

    <button class="btn-quiz" id="btnAbrirQuiz">🏆 ¡Reto Trivia del Cacomixtle!</button>
    <button class="btn-ruta" id="btnTrazarRuta">Trazar ruta hacia este punto</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- TEMPORIZADOR DE PANTALLA DE CARGA (3 SEGUNDOS) ---
    window.addEventListener('load', function() {
      setTimeout(function() {
        const loader = document.getElementById('loaderScreen');
        loader.classList.add('hidden');
      }, 3000); // 3000 ms = 3 segundos
    });

    // 1. Coordenadas de los Puntos de Interés
    const mercadoCoords = [19.331328473315608, -99.16249745266929];
    const mercadoCopilcoCoords = [19.33206414879216, -99.17026841588856];
    const parqueTepocatlCoords = [19.330606797917874, -99.16074211773814];
    const parqueAmezquiteCoords = [19.332821262974168, -99.16477662383282];
    const casaFelipeCoords = [19.329558139092832, -99.16802369199146]; // Nuevo Punto Agregado

    let destinoActual = mercadoCoords;
    let quizActual = null;

    // Base de datos de trivias para cada punto
    const trivias = {
      lasRosas: {
        pregunta: "🏆 🦊 🥳 ¿En qué década se consolidó este mercado durante las ocupaciones comunitarias?",
        opciones: [
          { texto: "a) En la década de 1950", correcta: false },
          { texto: "b) En la década de 1970", correcta: true },
          { texto: "c) En la década de 1990", correcta: false }
        ],
        mensajeExito: "¡Exacto! El Pedregal y el Mercado Las Rosas se fundaron en los años 70 con el trabajo comunitario.",
        audioExito: "¡Exacto! El Pedregal y el Mercado Las Rosas se fundaron en la década de mil novecientos setenta con la fuerza de la comunidad."
      },
      copilco: {
        pregunta: "🏆 🦊 🥳 ¿Sobre la roca de cuál volcán antiguo se construyó esta zona de Santo Domingo?",
        opciones: [
          { texto: "a) Volcán Popocatépetl", correcta: false },
          { texto: "b) Volcán Xitle", correcta: true },
          { texto: "c) Cerro de la Estrella", correcta: false }
        ],
        mensajeExito: "¡Correcto! Todo Santo Domingo se erigió sobre la lava derramada por el volcán Xitle.",
        audioExito: "¡Correcto! Santo Domingo y Copilco se erigieron sobre la roca volcánica del Xitle."
      },
      tepocatl: {
        pregunta: "🏆 🦊 🥳 ¿Cuáles son algunas actividades que buscan recuperar la identidad del Parque Tepocatl?",
        opciones: [
          { texto: "a) Animación digital, lecturas, vinilos y juegos tradicionales", correcta: true },
          { texto: "b) Carreras de autos de alta velocidad", correcta: false },
          { texto: "c) Demolición de espacios verdes", correcta: false }
        ],
        mensajeExito: "¡Excelente! A través del arte, la música y los juegos tradicionales se crea comunidad.",
        audioExito: "¡Excelente! Con arte, cine, música y juegos tradicionales recuperamos el Parque Tepocatl."
      },
      amezquite: {
        pregunta: "🏆 🦊 🥳 ¿Qué importancia tienen los espacios recreativos y parques de barrio en el Pedregal?",
        opciones: [
          { texto: "a) Son áreas de encuentro comunitario, esparcimiento y convivencia vecinal", correcta: true },
          { texto: "b) Son estacionamientos exclusivos para automóviles", correcta: false },
          { texto: "c) Son únicamente zonas de reserva industrial", correcta: false }
        ],
        mensajeExito: "¡Muy bien! Los parques de barrio son el corazón del encuentro y la vida comunitaria.",
        audioExito: "¡Muy bien! Los parques comunitarios fortalecen el tejido social y la convivencia del barrio."
      },
      casaFelipe: {
        pregunta: "🏆 🦊 🥳 ¿Qué representan las casas históricas y puntos comunitarios dentro del Pedregal de Santo Domingo?",
        opciones: [
          { texto: "a) La memoria viva, autogestión y la historia de fundación del barrio", correcta: true },
          { texto: "b) Zonas comerciales exclusivas", correcta: false },
          { texto: "c) Espacios privados sin relevancia cultural", correcta: false }
        ],
        mensajeExito: "¡Muy bien! Cada espacio del barrio resguarda la historia y resistencia comunitaria de Santo Domingo.",
        audioExito: "¡Excelente! Conociendo nuestros puntos comunitarios mantenemos viva la memoria histórica del barrio."
      }
    };

    // 2. Coordenadas por defecto (Cacomixtle)
    let userCoords = [19.3310, -99.1620]; 
    let primerCentrado = false;

    // 3. Inicializar el Mapa
    const map = L.map('map').setView(mercadoCoords, 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // --- ENLACES DIRECTOS DE IMÁGENES ---
    const urlMercado = 'https://i.ibb.co/BVQkk5FQ/mercado-de-las-roas.jpg';
    const urlMercadoCopilco = 'https://i.ibb.co/m5SR4nfj/FOTO-OFICIAL.jpg';
    const urlParqueTepocatl = 'https://i.ibb.co/QjqTNFpX/PARQUE-ANIMADO.jpg';
    const urlParqueAmezquite = 'https://i.ibb.co/Pv8JGZJg/FACHADA-PARQUE-AMEZQUITE.jpg';
    const urlCasaFelipe = 'https://i.ibb.co/673QP1GZ/CASA-DE-FELIPE-3.jpg'; // Nueva imagen modal
    const urlLogoOficial = 'https://i.ibb.co/Cs3LN4z4/LOGO-OFICIAL.png'; // Nuevo logo oficial para marcador
    const urlCacomixtle = 'https://i.ibb.co/sJXgFkyV/CACOMIXTLE-PERSONAJE.png';

    // Marcadores Iconos
    const cacomixtleIcon = L.icon({ iconUrl: urlCacomixtle, iconSize: [60, 60], iconAnchor: [30, 30], popupAnchor: [0, -30], className: 'custom-icon' });
    const mercadoIcon = L.icon({ iconUrl: urlMercado, iconSize: [60, 60], iconAnchor: [30, 30], popupAnchor: [0, -30], className: 'custom-icon' });
    const mercadoCopilcoIcon = L.icon({ iconUrl: urlMercadoCopilco, iconSize: [60, 60], iconAnchor: [30, 30], popupAnchor: [0, -30], className: 'custom-icon' });
    const parqueTepocatlIcon = L.icon({ iconUrl: urlParqueTepocatl, iconSize: [60, 60], iconAnchor: [30, 30], popupAnchor: [0, -30], className: 'custom-icon' });
    const parqueAmezquiteIcon = L.icon({ iconUrl: urlParqueAmezquite, iconSize: [60, 60], iconAnchor: [30, 30], popupAnchor: [0, -30], className: 'custom-icon' });
    const casaFelipeIcon = L.icon({ iconUrl: urlLogoOficial, iconSize: [60, 60], iconAnchor: [30, 30], popupAnchor: [0, -30], className: 'custom-icon' }); // Nuevo Icono

    // Capas
    let lineaRuta = null;
    let marcadoresHuellas = [];
    let rutaActiva = false;

    const mercadoMarker = L.marker(mercadoCoords, { icon: mercadoIcon }).addTo(map);
    const mercadoCopilcoMarker = L.marker(mercadoCopilcoCoords, { icon: mercadoCopilcoIcon }).addTo(map);
    const parqueTepocatlMarker = L.marker(parqueTepocatlCoords, { icon: parqueTepocatlIcon }).addTo(map);
    const parqueAmezquiteMarker = L.marker(parqueAmezquiteCoords, { icon: parqueAmezquiteIcon }).addTo(map);
    const casaFelipeMarker = L.marker(casaFelipeCoords, { icon: casaFelipeIcon }).addTo(map); // Nuevo Marcador en Mapa

    // Elementos DOM del Modal
    const modal = document.getElementById('modalImagen');
    const imgGrande = document.getElementById('imgGrande');
    const modalTitulo = document.getElementById('modalTitulo');
    const burbujaPregon = document.getElementById('burbujaPregon');
    const textoDescripcion = document.getElementById('textoDescripcion');
    const linkVideo = document.getElementById('linkVideo');
    const btnCerrar = document.getElementById('btnCerrar');
    const btnTrazarRuta = document.getElementById('btnTrazarRuta');
    const btnAbrirQuiz = document.getElementById('btnAbrirQuiz');
    const contenedorQuiz = document.getElementById('contenedorQuiz');
    const preguntaQuiz = document.getElementById('preguntaQuiz');
    const opcionesQuiz = document.getElementById('opcionesQuiz');
    const resultadoQuiz = document.getElementById('resultadoQuiz');

    // Función de Voz
    function hablarTexto(texto, velocidad = 1.0, tono = 1.0) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const locucion = new SpeechSynthesisUtterance(texto);
        locucion.lang = 'es-MX';
        locucion.rate = velocidad;
        locucion.pitch = tono;
        window.speechSynthesis.speak(locucion);
      }
    }

    // Preparar Quiz
    function cargarQuiz(datosQuiz) {
      quizActual = datosQuiz;
      contenedorQuiz.style.display = 'none';
      resultadoQuiz.innerHTML = '';
      preguntaQuiz.textContent = datosQuiz.pregunta;
      opcionesQuiz.innerHTML = '';

      datosQuiz.opciones.forEach(opc => {
        const btn = document.createElement('button');
        btn.className = 'btn-opcion';
        btn.textContent = opc.texto;
        btn.onclick = function() {
          if (opc.correcta) {
            resultadoQuiz.style.color = '#4CAF50';
            resultadoQuiz.innerHTML = `🏆 🦊 🥳 ¡GANASTE UNA HUELLITA!<br><small>${datosQuiz.mensajeExito}</small>`;
            hablarTexto(datosQuiz.audioExito, 1.0, 1.2);
          } else {
            resultadoQuiz.style.color = '#FF5252';
            resultadoQuiz.innerHTML = '❌ Inténtalo de nuevo. Revisa la descripción del lugar.';
            hablarTexto("Casi, intenta de nuevo leyendo la historia del lugar.", 1.0, 1.0);
          }
        };
        opcionesQuiz.appendChild(btn);
      });
    }

    btnAbrirQuiz.onclick = function() {
      contenedorQuiz.style.display = contenedorQuiz.style.display === 'block' ? 'none' : 'block';
    };

    // Clic Mercado Las Rosas
    mercadoMarker.on('click', function () {
      imgGrande.src = urlMercado;
      modalTitulo.textContent = 'Mercado Santo Domingo "LAS ROSAS"';
      burbujaPregon.innerHTML = '📢 🌽 🍎 🥑 🧔🏻‍♂️ 💖 <br><b>¡¡ PÁSELE, PÁSELE !! ¡¡ LLÉVELE, LLÉVELE !!<br>¡¡ FRUTAS Y VERDURAS FRESCAS DE HOY !!</b>';
      burbujaPregon.style.display = 'block';
      textoDescripcion.textContent = 'Surgió a la par del vertiginoso crecimiento del Pedregal de Santo Domingo a partir de las ocupaciones comunitarias de la década de 1970 sobre el terreno volcánico del Xitle. Fundado formalmente para dotar de abastecimiento básico a las familias que consolidaron la colonia, el mercado representa el paso de la autogestión urbana a la formalización de los servicios públicos en la zona.';
      linkVideo.href = 'https://drive.google.com/file/d/1-gIF3OPCS256DoxIeX3ygM_-KHVum9vq/view?usp=sharing';
      linkVideo.style.display = 'inline-block';
      destinoActual = mercadoCoords;
      
      cargarQuiz(trivias.lasRosas);
      modal.style.display = 'flex';
      hablarTexto("Pásele, pásele, llévele, llévele, frutas y verduras frescas de hoy", 1.1, 1.2);
    });

    // Clic Mercado Copilco El Alto
    mercadoCopilcoMarker.on('click', function () {
      imgGrande.src = urlMercadoCopilco;
      modalTitulo.textContent = 'Mercado No. 347 "Copilco El Alto"';
      burbujaPregon.style.display = 'none';
      textoDescripcion.textContent = 'Nacido de la histórica lucha comunitaria que transformó la roca volcánica en hogar, el Mercado Copilco El Alto es memoria viva del Pedregal de Santo Domingo. Más que un centro de abasto, es un pilar de identidad y tradición donde el esfuerzo colectivo de sus fundadores sigue resonando en cada pasillo. Entre el andar diario de los vecinos, la calidez de sus comerciantes y el sazón de su gente, el mercado resguarda la esencia solidaria de un barrio que se construyó con las manos de su propia comunidad.';
      linkVideo.href = 'https://drive.google.com/file/d/1MRsbJUCbXXKFMwJo88o_Pw89Ybjf3BWO/view?usp=sharing';
      linkVideo.style.display = 'inline-block';
      destinoActual = mercadoCopilcoCoords;
      
      cargarQuiz(trivias.copilco);
      modal.style.display = 'flex';
    });

    // Clic Parque Tepocatl
    parqueTepocatlMarker.on('click', function () {
      imgGrande.src = urlParqueTepocatl;
      modalTitulo.textContent = 'Parque Tepocatl';
      burbujaPregon.style.display = 'none';
      textoDescripcion.innerHTML = 'Bienvenidos a parque Tepocatl, 🌳 un lugar que buscamos recuperar con la presencia de actividades artísticas y culturales 🖌️🎬🎭 como animación digital, lecturas, eventos especiales como recuerdos de música 🎵 y canciones en vinilos, juegos tradicionales y de destreza, también realizamos entrevistas y mucho más, con el objetivo de crear comunidad e identidad del lugar para que este sea un espacio de convivencia, sano y divertido 😊💖';
      linkVideo.href = 'https://drive.google.com/file/d/1YQJKy88_vkFqam5Q7KWzNhKqq7twVomP/view?usp=sharing';
      linkVideo.style.display = 'inline-block';
      destinoActual = parqueTepocatlCoords;
      
      cargarQuiz(trivias.tepocatl);
      modal.style.display = 'flex';
      hablarTexto("¡Bienvenidos al Parque Tepocatl! Un espacio para la convivencia, el arte y la comunidad.", 1.0, 1.1);
    });

    // Clic Parque Amézquite
    parqueAmezquiteMarker.on('click', function () {
      imgGrande.src = urlParqueAmezquite;
      modalTitulo.textContent = 'Parque Amézquite';
      burbujaPregon.style.display = 'none';
      textoDescripcion.innerHTML = 'Parque amezquite 🌳 se encuentra dentro del pedregal de santo domingo y forma parte de los territorios de paz 🕊️ de toda la ciudad de mexico. Se encuentra en esta ruta cultural 🗺️ y puedes encontrarnos los martes por las tardes realizando diferentes actividades culturales y artísticas como: realidad virtual 🥽, reciclado 🍼, pintura 🖌️ , manualidades ✂️🧴. Asi que recuerda “tarde de martes, tarde de actividades culturales” 👧🏻👦🏻💖.';
      linkVideo.href = 'https://drive.google.com/file/d/17yDWhKmOfUT15nmuhMoBgzrYu2qec3ZS/view?usp=sharing';
      linkVideo.style.display = 'inline-block';
      destinoActual = parqueAmezquiteCoords;
      
      cargarQuiz(trivias.amezquite);
      modal.style.display = 'flex';
      hablarTexto("Parque Amézquite se encuentra dentro del Pedregal de Santo Domingo y forma parte de los territorios de paz. ¡Te esperamos los martes por las tardes!", 1.0, 1.1);
    });

    // Clic Nuevo Punto (Casa de Felipe / Punto Cultural)
    casaFelipeMarker.on('click', function () {
      imgGrande.src = urlCasaFelipe;
      modalTitulo.textContent = 'Punto Cultural Santo Domingo';
      burbujaPregon.style.display = 'none';
      textoDescripcion.innerHTML = 'Bienvenidos a este espacio cultural del Pedregal de Santo Domingo 🏡, un punto donde fortalecemos la memoria histórica, el arte urbano y la convivencia comunitaria. Forma parte del recorrido territorial que promueve la paz, el juego tradicional y la preservación de nuestras raíces volcánicas 🌋💖.';
      linkVideo.style.display = 'none'; // Oculto hasta asignar enlace de video específico
      destinoActual = casaFelipeCoords;
      
      cargarQuiz(trivias.casaFelipe);
      modal.style.display = 'flex';
      hablarTexto("¡Bienvenidos a este nuevo punto cultural en la ruta del Pedregal de Santo Domingo!", 1.0, 1.1);
    });

    btnCerrar.onclick = function() { 
      modal.style.display = 'none'; 
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    };

    modal.onclick = function(e) { 
      if (e.target === modal) {
        modal.style.display = 'none';
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    };

    btnTrazarRuta.onclick = function() {
      modal.style.display = 'none';
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      rutaActiva = true;
      trazarRutaPorCalles(userCoords, destinoActual);
    };

    // Marcador Cacomixtle
    let userMarker = L.marker(userCoords, { icon: cacomixtleIcon }).addTo(map);
    const mensajeCacomixtle = "Prepárate para conocer el Pedregal de Santo Domingo, ¡acompáñame en este recorrido!";
    userMarker.bindPopup(`
      <div class="cacomixtle-popup">
        <h4>🐾 Cacomixtle Guía</h4>
        <p>"¡Prepárate para conocer el Pedregal de Santo Domingo, acompáñame en este recorrido!"</p>
      </div>
    `);

    userMarker.on('click', function() {
      hablarTexto(mensajeCacomixtle, 0.95, 1.1);
    });

    // 4. RASTREO EN TIEMPO REAL
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        function (position) {
          userCoords = [position.coords.latitude, position.coords.longitude];
          userMarker.setLatLng(userCoords);

          if (!primerCentrado) {
            map.setView(userCoords, 17);
            primerCentrado = true;
          }

          if (rutaActiva) {
            trazarRutaPorCalles(userCoords, destinoActual);
          }
        },
        function (error) {
          console.warn("Asegúrate de activar el GPS/Ubicación de tu celular.");
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    // 5. Trazar ruta por calles
    function trazarRutaPorCalles(origen, destino) {
      const urlOSRM = `https://router.project-osrm.org/route/v1/foot/${origen[1]},${origen[0]};${destino[1]},${destino[0]}?overview=full&geometries=geojson`;

      fetch(urlOSRM)
        .then(response => response.json())
        .then(data => {
          if (data.routes && data.routes.length > 0) {
            const coordinates = data.routes[0].geometry.coordinates;
            const latLngs = coordinates.map(coord => [coord[1], coord[0]]);

            if (lineaRuta) map.removeLayer(lineaRuta);
            marcadoresHuellas.forEach(m => map.removeLayer(m));
            marcadoresHuellas = [];

            lineaRuta = L.polyline(latLngs, { color: '#E91E63', weight: 6, opacity: 0.8 }).addTo(map);

            const huellaSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFFFFF'><path d='M12 14c-2.5 0-4.5 1.8-4.5 4 0 1.5 1 2.5 2.5 2.5 1.2 0 2-.6 2-1.5 0 .9.8 1.5 2 1.5 1.5 0 2.5-1 2.5-2.5 0-2.2-2-4-4.5-4zm-5.5-3c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm11 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-8.5-5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z'/></svg>";
            const iconHuella = L.icon({ iconUrl: huellaSvg, iconSize: [16, 16], iconAnchor: [8, 8] });

            const salto = Math.max(1, Math.floor(latLngs.length / 15));
            for (let i = 0; i < latLngs.length; i += salto) {
              const markerH = L.marker(latLngs[i], { icon: iconHuella }).addTo(map);
              marcadoresHuellas.push(markerH);
            }
          }
        })
        .catch(err => console.error("Error obteniendo ruta por calles:", err));
    }
  </script>
</body>
