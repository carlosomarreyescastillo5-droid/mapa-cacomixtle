
     <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Mapa Interactivo - Cacomixtle en vivo</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; }
    #map { width: 100%; height: 100vh; }

    /* Estilos para los marcadores */
    .leaflet-marker-icon.custom-icon {
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      object-fit: cover;
      background-color: #ffffff;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    /* Estilos para la ventana modal emergente */
    .modal-imagen {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-contenido {
      max-width: 90%;
      max-height: 50vh;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    .modal-info {
      color: white;
      text-align: center;
      margin-top: 15px;
      max-width: 90%;
    }

    .modal-info h3 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #FFD54F;
    }

    .modal-info p {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 12px;
      color: #E0E0E0;
    }

    .modal-info a {
      display: inline-block;
      color: #4FC3F7;
      font-weight: bold;
      text-decoration: underline;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .modal-cerrar {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #ffffff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .btn-ruta {
      padding: 12px 24px;
      background-color: #E91E63;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Ventana Modal emergente -->
  <div id="modalImagen" class="modal-imagen">
    <span class="modal-cerrar" id="btnCerrar">&times;</span>
    <img id="imgGrande" class="modal-contenido" src="" alt="Mercado Santo Domingo Las Rosas" />
    
    <div class="modal-info">
      <h3>Mercado Santo Domingo Las Rosas</h3>
      <p id="textoDescripcion">Punto emblemático de abasto y encuentro comunitario en el Pedregal de Santo Domingo.</p>
      <a id="linkVideo" href="https://youtube.com" target="_blank">📺 Ver video del lugar</a>
    </div>

    <button class="btn-ruta" id="btnTrazarRuta">Trazar ruta hacia este punto</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Coordenadas del Mercado Santo Domingo Las Rosas
    const mercadoCoords = [19.331328473315608, -99.16249745266929];

    // 2. Coordenadas por defecto
    let userCoords = [19.3310, -99.1620]; 
    let primerCentrado = false;

    // 3. Inicializar el Mapa
    const map = L.map('map').setView(mercadoCoords, 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // --- ENLACES DIRECTOS DE IMGBB ---
    const urlMercado = 'https://i.ibb.co/BVQkk5FQ/mercado-de-las-roas.jpg';
    const urlCacomixtle = 'https://i.ibb.co/sJXgFkyV/CACOMIXTLE-PERSONAJE.png';

    const cacomixtleIcon = L.icon({
      iconUrl: urlCacomixtle,
      iconSize: [60, 60],
      iconAnchor: [30, 30],
      popupAnchor: [0, -30],
      className: 'custom-icon'
    });

    const mercadoIcon = L.icon({
      iconUrl: urlMercado,
      iconSize: [60, 60],
      iconAnchor: [30, 30],
      popupAnchor: [0, -30],
      className: 'custom-icon'
    });

    // Capas para las líneas de la ruta
    let lineaFondo = null;
    let lineaHuellas = null;
    let rutaActiva = false;

    // Marcador del Mercado
    const mercadoMarker = L.marker(mercadoCoords, { icon: mercadoIcon }).addTo(map);

    // Modal
    const modal = document.getElementById('modalImagen');
    const imgGrande = document.getElementById('imgGrande');
    const btnCerrar = document.getElementById('btnCerrar');
    const btnTrazarRuta = document.getElementById('btnTrazarRuta');

    mercadoMarker.on('click', function () {
      imgGrande.src = urlMercado;
      modal.style.display = 'flex';
    });

    btnCerrar.onclick = function() { modal.style.display = 'none'; };
    modal.onclick = function(e) { if (e.target === modal) modal.style.display = 'none'; };

    btnTrazarRuta.onclick = function() {
      modal.style.display = 'none';
      rutaActiva = true;
      trazarRuta(userCoords, mercadoCoords);
    };

    // Marcador del Cacomixtle
    let userMarker = L.marker(userCoords, { icon: cacomixtleIcon }).addTo(map);
    userMarker.bindPopup('<b>¡Aquí estás tú! (Cacomixtle)</b>');

    // 4. RASTREO EN TIEMPO REAL
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        function (position) {
          userCoords = [position.coords.latitude, position.coords.longitude];
          userMarker.setLatLng(userCoords);

          if (!primerCentrado) {
            map.setView(userCoords, 17);
            primerCentrado = true;
          }

          if (rutaActiva) {
            trazarRuta(userCoords, mercadoCoords);
          }
        },
        function (error) {
          console.warn("Asegúrate de activar el GPS/Ubicación de tu celular.");
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    // 5. Función de Trazado Directo e Inmediato
    function trazarRuta(origen, destino) {
      // Limpiar líneas previas si existen
      if (lineaFondo) map.removeLayer(lineaFondo);
      if (lineaHuellas) map.removeLayer(lineaHuellas);

      const PuntosRuta = [origen, destino];

      // Línea rosa de base
      lineaFondo = L.polyline(PuntosRuta, {
        color: '#E91E63',
        weight: 8,
        opacity: 0.7
      }).addTo(map);

      // Trazo blanco punteado simulando pisadas sobre la ruta
      lineaHuellas = L.polyline(PuntosRuta, {
        color: '#FFFFFF',
        weight: 4,
        opacity: 0.9,
        dashArray: '8, 12'
      }).addTo(map);
    }
  </script>
</body>
</html>
