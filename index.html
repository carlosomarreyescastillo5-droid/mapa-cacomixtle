
     <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Mapa Interactivo - Cacomixtle en vivo</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; }
    #map { width: 100%; height: 100vh; }

    /* Estilos para los marcadores */
    .leaflet-marker-icon.custom-icon {
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      object-fit: cover;
      background-color: #ffffff;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    /* --- ESTILOS PARA LA VENTANA MODAL GRANDE DE LA IMAGEN --- */
    .modal-imagen {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }

    .modal-contenido {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    .modal-cerrar {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #ffffff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .btn-ruta {
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #E91E63;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Ventana Modal emergente para la imagen en grande -->
  <div id="modalImagen" class="modal-imagen">
    <span class="modal-cerrar" id="btnCerrar">&times;</span>
    <img id="imgGrande" class="modal-contenido" src="" alt="Mercado Santo Domingo Las Rosas" />
    <button class="btn-ruta" id="btnTrazarRuta">Trazar ruta hacia este punto</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Routing Machine JS -->
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <!-- Leaflet PolylineDecorator (Para las huellitas a lo largo de la ruta) -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet-polylinedecorator@1.6.0/leaflet.polylineDecorator.min.js"></script>

  <script>
    // 1. Coordenadas del Mercado Santo Domingo Las Rosas
    const mercadoCoords = [19.331328473315608, -99.16249745266929];

    // 2. Coordenadas por defecto
    let userCoords = [19.3310, -99.1620]; 
    let primerCentrado = false;

    // 3. Inicializar el Mapa
    const map = L.map('map').setView(mercadoCoords, 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // --- ENLACES DIRECTOS DE IMGBB ---
    const urlMercado = 'https://i.ibb.co/BVQkk5FQ/mercado-de-las-roas.jpg';
    const urlCacomixtle = 'https://i.ibb.co/sJXgFkyV/CACOMIXTLE-PERSONAJE.png';

    const cacomixtleIcon = L.icon({
      iconUrl: urlCacomixtle,
      iconSize: [60, 60],
      iconAnchor: [30, 30],
      popupAnchor: [0, -30],
      className: 'custom-icon'
    });

    const mercadoIcon = L.icon({
      iconUrl: urlMercado,
      iconSize: [60, 60],
      iconAnchor: [30, 30],
      popupAnchor: [0, -30],
      className: 'custom-icon'
    });

    let routingControl = null;
    let decorator = null; // Capa para las huellitas

    // Icono SVG de huellita de animalito para la ruta
    const huellaSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23E91E63'><path d='M12 14c-2.5 0-4.5 1.8-4.5 4 0 1.5 1 2.5 2.5 2.5 1.2 0 2-.6 2-1.5 0 .9.8 1.5 2 1.5 1.5 0 2.5-1 2.5-2.5 0-2.2-2-4-4.5-4zm-5.5-3c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm11 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-8.5-5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z'/></svg>";

    const huellaIcon = L.icon({
      iconUrl: huellaSvg,
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });

    // Marcador del Mercado
    const mercadoMarker = L.marker(mercadoCoords, { icon: mercadoIcon }).addTo(map);

    // Modal
    const modal = document.getElementById('modalImagen');
    const imgGrande = document.getElementById('imgGrande');
    const btnCerrar = document.getElementById('btnCerrar');
    const btnTrazarRuta = document.getElementById('btnTrazarRuta');

    mercadoMarker.on('click', function () {
      imgGrande.src = urlMercado;
      modal.style.display = 'flex';
    });

    btnCerrar.onclick = function() { modal.style.display = 'none'; };
    modal.onclick = function(e) { if (e.target === modal) modal.style.display = 'none'; };

    btnTrazarRuta.onclick = function() {
      modal.style.display = 'none';
      trazarRuta(userCoords, mercadoCoords);
    };

    // Marcador del Cacomixtle
    let userMarker = L.marker(userCoords, { icon: cacomixtleIcon }).addTo(map);
    userMarker.bindPopup('<b>¡Aquí estás tú! (Cacomixtle)</b>');

    // 4. RASTREO EN TIEMPO REAL
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        function (position) {
          userCoords = [position.coords.latitude, position.coords.longitude];
          userMarker.setLatLng(userCoords);

          if (!primerCentrado) {
            map.setView(userCoords, 17);
            primerCentrado = true;
          }

          if (routingControl !== null) {
            trazarRuta(userCoords, mercadoCoords);
          }
        },
        function (error) {
          console.warn("Asegúrate de activar el GPS/Ubicación de tu celular.");
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    // 5. Función de Trazado de Ruta con Huellitas
    function trazarRuta(origen, destino) {
      if (routingControl !== null) {
        map.removeControl(routingControl);
      }
      if (decorator !== null) {
        map.removeLayer(decorator);
      }

      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(origen[0], origen[1]),
          L.latLng(destino[0], destino[1])
        ],
        router: L.Routing.osrmv1({ profile: 'foot' }),
        lineOptions: {
          styles: [{ color: '#E91E63', opacity: 0.3, weight: 6 }] // Línea guía tenue
        },
        createMarker: function() { return null; },
        addWaypoints: false,
        draggableWaypoints: false,
        fitSelectedRoutes: false
      }).addTo(map);

      // Cuando la ruta se calcula, dibujamos las huellitas a lo largo del camino
      routingControl.on('routesfound', function(e) {
        if (decorator !== null) {
          map.removeLayer(decorator);
        }

        const route = e.routes[0];
        const line = L.polyline(route.coordinates);

        decorator = L.polylineDecorator(line, {
          patterns: [
            {
              offset: 15, // Distancia inicial
              repeat: 30, // Separación entre cada huellita en píxeles
              symbol: L.Symbol.marker({
                rotate: true, // Orienta las huellitas hacia la dirección del camino
                markerOptions: {
                  icon: huellaIcon
                }
              })
            }
          ]
        }).addTo(map);
      });
    }
  </script>
</body>
</html>
